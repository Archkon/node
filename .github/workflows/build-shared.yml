name: Build Node.js (shared libraries)

on:
  workflow_call:
    inputs:
      runner:
        description: The runner to use for the job.
        required: true
        type: string
      extra-nix-flags:
        description: Additional CLI arguments appended to the nix-shell invocation.
        required: false
        type: string
        default: ''
      with-sccache:
        description: Whether to enable sccache
        required: false
        type: boolean
        default: false
      v8-nar:
        description: An optional name for the NAR archive for V8 that needs to be downloaded
        required: false
        type: string
        default: ''
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Cachix auth token for nodejs.cachix.org.
        required: false

permissions: {}

env:
  FLAKY_TESTS: keep_retrying
  LOG_DIR: ${{ github.workspace }}/workflow-logs
  NODE_DEBUG: ''
  NODE_DEBUG_NATIVE: ''
  NODE_INSPECT_DEBUG_LOG_DIR: ${{ github.workspace }}/workflow-logs/inspect-debug
  NODE_INSPECT_DETAILED_LOG: '0'
  NODE_INSPECT_TRACE: '1'
  NODE_INSPECT_TRACE_LIMIT: '512'
  NODE_INSPECT_TRACE_REPORT: '1'
  NODE_INSPECT_TRACE_DUMP_ON_SIGNAL: '1'
  NODE_INSPECT_NATIVE_TRACE_DUMP_ON_SIGNAL: '0'
  NODE_INSPECT_TRACE_DUMP_ON_EXIT: '0'
  NODE_INSPECT_TRACE_DUMP_ON_WAIT: '1'

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: tarballs
          pattern: '*.tar.gz'
          merge-multiple: true

      - name: Extract tarball
        shell: bash
        run: |
          tar xzf tarballs/*.tar.gz -C "$RUNNER_TEMP"
          echo "TAR_DIR=$RUNNER_TEMP/$(basename tarballs/*.tar.gz .tar.gz)" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3  # v31.10.6
        with:
          extra_nix_config: sandbox = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        with:
          name: nodejs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        if: inputs.v8-nar
        with:
          name: ${{ inputs.v8-nar }}

      - name: Configure sccache
        if: inputs.with-sccache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            core.exportVariable('SCCACHE_GHA_ENABLED', 'on');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('NIX_SCCACHE', '(import <nixpkgs> {}).sccache');

      - name: Build Node.js and run tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR" "$NODE_INSPECT_DEBUG_LOG_DIR"
          nix-shell \
            -I "nixpkgs=$TAR_DIR/tools/nix/pkgs.nix" \
            --pure --keep TAR_DIR --keep FLAKY_TESTS --keep NODE_DEBUG --keep NODE_DEBUG_NATIVE --keep NODE_INSPECT_DEBUG_LOG_DIR --keep NODE_INSPECT_DETAILED_LOG \
            --keep NODE_INSPECT_TRACE --keep NODE_INSPECT_TRACE_LIMIT --keep NODE_INSPECT_TRACE_REPORT --keep NODE_INSPECT_TRACE_DUMP_ON_SIGNAL --keep NODE_INSPECT_NATIVE_TRACE_DUMP_ON_SIGNAL --keep NODE_INSPECT_TRACE_DUMP_ON_EXIT --keep NODE_INSPECT_TRACE_DUMP_ON_WAIT \
            --keep SCCACHE_GHA_ENABLED --keep ACTIONS_CACHE_SERVICE_V2 --keep ACTIONS_RESULTS_URL --keep ACTIONS_RUNTIME_TOKEN \
            --arg loadJSBuiltinsDynamically false \
            --arg ccache "${NIX_SCCACHE:-null}" \
            --arg devTools '[]' \
            --arg benchmarkTools '[]' \
            ${{ inputs.extra-nix-flags }} \
            --run '
                echo "NODE_DEBUG=$NODE_DEBUG"
                echo "NODE_DEBUG_NATIVE=$NODE_DEBUG_NATIVE"
                echo "NODE_INSPECT_DEBUG_LOG_DIR=$NODE_INSPECT_DEBUG_LOG_DIR"
                echo "NODE_INSPECT_DETAILED_LOG=$NODE_INSPECT_DETAILED_LOG"
                echo "NODE_INSPECT_TRACE=$NODE_INSPECT_TRACE"
                echo "NODE_INSPECT_TRACE_LIMIT=$NODE_INSPECT_TRACE_LIMIT"
                echo "NODE_INSPECT_TRACE_REPORT=$NODE_INSPECT_TRACE_REPORT"
                echo "NODE_INSPECT_TRACE_DUMP_ON_SIGNAL=$NODE_INSPECT_TRACE_DUMP_ON_SIGNAL"
                echo "NODE_INSPECT_NATIVE_TRACE_DUMP_ON_SIGNAL=$NODE_INSPECT_NATIVE_TRACE_DUMP_ON_SIGNAL"
                echo "NODE_INSPECT_TRACE_DUMP_ON_EXIT=$NODE_INSPECT_TRACE_DUMP_ON_EXIT"
                echo "NODE_INSPECT_TRACE_DUMP_ON_WAIT=$NODE_INSPECT_TRACE_DUMP_ON_WAIT"
                echo "CI_SKIP_TESTS=$CI_SKIP_TESTS"
                make -C "$TAR_DIR" run-ci -j4 V=1 TEST_CI_ARGS="-p actions --measure-flakiness 9 --skip-tests=$CI_SKIP_TESTS"
            ' "$TAR_DIR/shell.nix" 2>&1 |
            tee "$LOG_DIR/build-shared.log"

      - name: Collect workflow diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$LOG_DIR" "$NODE_INSPECT_DEBUG_LOG_DIR"
          {
            echo "workflow=${{ github.workflow }}"
            echo "job=${{ github.job }}"
            echo "runner.os=${{ runner.os }}"
            echo "runner.arch=${{ runner.arch }}"
            echo "runner.name=${{ runner.name }}"
            echo "github.run_id=${{ github.run_id }}"
            echo "github.run_attempt=${{ github.run_attempt }}"
            echo "NODE_DEBUG=$NODE_DEBUG"
            echo "NODE_DEBUG_NATIVE=$NODE_DEBUG_NATIVE"
            echo "NODE_INSPECT_DEBUG_LOG_DIR=$NODE_INSPECT_DEBUG_LOG_DIR"
            echo "NODE_INSPECT_DETAILED_LOG=$NODE_INSPECT_DETAILED_LOG"
            echo "NODE_INSPECT_TRACE=$NODE_INSPECT_TRACE"
            echo "NODE_INSPECT_TRACE_LIMIT=$NODE_INSPECT_TRACE_LIMIT"
            echo "NODE_INSPECT_TRACE_REPORT=$NODE_INSPECT_TRACE_REPORT"
            echo "NODE_INSPECT_TRACE_DUMP_ON_SIGNAL=$NODE_INSPECT_TRACE_DUMP_ON_SIGNAL"
            echo "NODE_INSPECT_NATIVE_TRACE_DUMP_ON_SIGNAL=$NODE_INSPECT_NATIVE_TRACE_DUMP_ON_SIGNAL"
            echo "NODE_INSPECT_TRACE_DUMP_ON_EXIT=$NODE_INSPECT_TRACE_DUMP_ON_EXIT"
            echo "NODE_INSPECT_TRACE_DUMP_ON_WAIT=$NODE_INSPECT_TRACE_DUMP_ON_WAIT"
            date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
            uname -a || true
            ulimit -a || true
            pwd
            df -h || true
            echo "--- inspect-debug files ---"
            if [ -d "$NODE_INSPECT_DEBUG_LOG_DIR" ]; then
              find "$NODE_INSPECT_DEBUG_LOG_DIR" -maxdepth 1 -type f -print | sort | while IFS= read -r file; do
                echo "file=$file"
                wc -c "$file" || true
                head -n 1 "$file" || true
              done
            fi
          } > "$LOG_DIR/diagnostics.txt"
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
            mkdir -p "$LOG_DIR/DiagnosticReports"
            cp -R "$HOME/Library/Logs/DiagnosticReports/." "$LOG_DIR/DiagnosticReports/" || true
          fi

      - name: Upload workflow logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: shared-build-logs-${{ inputs.runner }}-${{ runner.os }}-${{ runner.arch }}-${{ runner.name }}
          path: ${{ env.LOG_DIR }}
