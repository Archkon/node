name: Test macOS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - '**.nix'
      - eslint.config.mjs
      - '**/eslint.config_partial.mjs'
      - android-configure
      - android-configure.py
      - android-patches/**
      - benchmarks/**
      - codecov.yml
      - doc/**
      - pyproject.yml
      - tsconfig.json
      - test/internet/**
      - tools/actions/**
      - tools/dep_updaters/**
      - tools/doc/**
      - tools/eslint-rules/**
      - tools/eslint/**
      - tools/lint-md/**
      - typings/**
      - vcbuild.bat
      - .**
      - '!.github/workflows/test-macos.yml'
  push:
    paths-ignore:
      - '**.md'
      - '**.nix'
      - eslint.config.mjs
      - '**/eslint.config_partial.mjs'
      - android-configure
      - android-configure.py
      - android-patches/**
      - benchmarks/**
      - codecov.yml
      - doc/**
      - pyproject.yml
      - tsconfig.json
      - test/internet/**
      - tools/actions/**
      - tools/dep_updaters/**
      - tools/doc/**
      - tools/eslint-rules/**
      - tools/eslint/**
      - tools/lint-md/**
      - typings/**
      - vcbuild.bat
      - .**
      - '!.github/workflows/test-macos.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  XCODE_VERSION: '16.4'
  FLAKY_TESTS: keep_retrying
  RUSTC_VERSION: '1.86'
  NODE_DEBUG: inspect,inspect_probe
  NODE_DEBUG_NATIVE: inspector,inspector_profiler
  NODE_INSPECT_DETAILED_LOG: '1'

permissions:
  contents: read

jobs:
  test-macOS:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
    runs-on: macos-15
    env:
      CC: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} gcc
      CXX: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} g++
      LOG_DIR: ${{ github.workspace }}/test-logs
      NODE_INSPECT_DEBUG_LOG_DIR: ${{ github.workspace }}/test-logs/inspect-debug
      SCCACHE_GHA_ENABLED: ${{ github.base_ref == 'main' || github.ref_name == 'main' }}
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          path: node
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
      - name: Set up Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - name: Install Rust ${{ env.RUSTC_VERSION }}
        run: |
          rustup override set "$RUSTC_VERSION"
          rustup --version
      - name: Set up sccache
        if: github.base_ref == 'main' || github.ref_name == 'main'
        uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
        with:
          version: v0.16.0
      # The `npm ci` for this step fails a lot as part of the Test step. Run it
      # now so that we don't have to wait 2 hours for the Build step to pass
      # first before that failure happens. (And if there's something about
      # `make run-ci -j3` that is causing the failure and the failure doesn't
      # happen anymore running this step here first, that's also useful
      # information.)
      - name: tools/doc/node_modules workaround
        run: make -C node tools/doc/node_modules
      # This is needed due to https://github.com/nodejs/build/issues/3878
      - name: Cleanup
        run: |
          echo "::group::Free space before cleanup"
          df -h
          echo "::endgroup::"
          echo "::group::Cleaned Files"

          sudo rm -rf /Users/runner/Library/Android/sdk

          echo "::endgroup::"
          echo "::group::Free space after cleanup"
          df -h
          echo "::endgroup::"
      - name: Build
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR" "$NODE_INSPECT_DEBUG_LOG_DIR"
          {
            echo "NODE_DEBUG=$NODE_DEBUG"
            echo "NODE_DEBUG_NATIVE=$NODE_DEBUG_NATIVE"
            echo "NODE_INSPECT_DEBUG_LOG_DIR=$NODE_INSPECT_DEBUG_LOG_DIR"
            echo "NODE_INSPECT_DETAILED_LOG=$NODE_INSPECT_DETAILED_LOG"
            make -C node build-ci -j$(getconf _NPROCESSORS_ONLN) V=1 CONFIG_FLAGS="--error-on-warn --v8-enable-temporal-support"
          } 2>&1 | tee "$LOG_DIR/build.log"
      - name: Free Space After Build
        run: df -h
      - name: Test
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR" "$NODE_INSPECT_DEBUG_LOG_DIR"
          {
            echo "NODE_DEBUG=$NODE_DEBUG"
            echo "NODE_DEBUG_NATIVE=$NODE_DEBUG_NATIVE"
            echo "NODE_INSPECT_DEBUG_LOG_DIR=$NODE_INSPECT_DEBUG_LOG_DIR"
            echo "NODE_INSPECT_DETAILED_LOG=$NODE_INSPECT_DETAILED_LOG"
            make -C node test-ci -j1 V=1 TEST_CI_ARGS="-p actions --measure-flakiness 9"
          } 2>&1 |
            tee "$LOG_DIR/test-ci.log"
      - name: Re-run test in a folder whose name contains unusual chars
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR" "$NODE_INSPECT_DEBUG_LOG_DIR"
          mv node "$DIR"
          cd "$DIR"
          {
            echo "DIR=$DIR"
            echo "NODE_DEBUG=$NODE_DEBUG"
            echo "NODE_DEBUG_NATIVE=$NODE_DEBUG_NATIVE"
            echo "NODE_INSPECT_DEBUG_LOG_DIR=$NODE_INSPECT_DEBUG_LOG_DIR"
            echo "NODE_INSPECT_DETAILED_LOG=$NODE_INSPECT_DETAILED_LOG"
            python3 ./tools/test.py --flaky-tests keep_retrying -p actions -j 4
          } 2>&1 |
            tee "$LOG_DIR/unusual-path-test.log"
        env:
          DIR: dir%20with $unusual"chars?'åß∂ƒ©∆¬…`
      - name: Collect workflow diagnostics
        if: always()
        run: |
          mkdir -p "$LOG_DIR" "$NODE_INSPECT_DEBUG_LOG_DIR"
          {
            echo "workflow=${{ github.workflow }}"
            echo "job=${{ github.job }}"
            echo "runner.os=${{ runner.os }}"
            echo "runner.arch=${{ runner.arch }}"
            echo "runner.name=${{ runner.name }}"
            echo "github.run_id=${{ github.run_id }}"
            echo "github.run_attempt=${{ github.run_attempt }}"
            echo "NODE_DEBUG=$NODE_DEBUG"
            echo "NODE_DEBUG_NATIVE=$NODE_DEBUG_NATIVE"
            echo "NODE_INSPECT_DEBUG_LOG_DIR=$NODE_INSPECT_DEBUG_LOG_DIR"
            echo "NODE_INSPECT_DETAILED_LOG=$NODE_INSPECT_DETAILED_LOG"
            date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
            uname -a || true
            ulimit -a || true
            pwd
            df -h || true
            find "$NODE_INSPECT_DEBUG_LOG_DIR" -maxdepth 1 -type f -print -exec wc -c {} \; 2>/dev/null || true
          } > "$LOG_DIR/diagnostics.txt"
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
            mkdir -p "$LOG_DIR/DiagnosticReports"
            cp -R "$HOME/Library/Logs/DiagnosticReports/." "$LOG_DIR/DiagnosticReports/" || true
          fi
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: macos-test-logs
          path: ${{ env.LOG_DIR }}
